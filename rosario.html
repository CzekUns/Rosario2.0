<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Rosario guidato mobile-first con corona interattiva, testo e sintesi vocale."
    />
    <title>Rosario guidato · Rosario 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Castoro+Titling&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="rosary-page">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="grain-overlay"></div>

    <header class="topbar rosary-topbar">
      <a class="brand" href="index.html" aria-label="Torna alla home">
        <span class="brand-mark">✦</span>
        <span>Rosario 2.0</span>
      </a>
      <nav class="nav" aria-label="Navigazione Rosario">
        <a href="index.html">Home</a>
        <a href="index.html#app">Sezioni</a>
      </nav>
      <span class="status-pill" id="speechSupport">Audio browser</span>
    </header>

    <main class="rosary-focus" id="rosario">
      <section class="rosary-layout rosary-layout-dedicated">
        <article class="prayer-card prayer-card-dedicated">
          <div class="card-topline">
            <span id="modeLabel">Rosario breve</span>
            <span id="durationEstimate">~4 min</span>
          </div>

          <div class="step-heading">
            <span id="currentStepType">Pronto</span>
            <strong id="stepCode">Inizio</strong>
          </div>

          <h1 id="prayerTitle">Segno della Croce</h1>
          <p id="prayerText">
            Nel nome del Padre, del Figlio e dello Spirito Santo. Amen.
          </p>

          <div class="progress-wrap" aria-label="Avanzamento Rosario">
            <div class="progress-bar">
              <span id="progressFill"></span>
            </div>
            <span id="progressLabel">0%</span>
          </div>

          <details class="prayer-settings">
            <summary>Intenzione e impostazioni</summary>
            <div class="settings-content">
              <label class="field">
                <span>Il nodo da affidare</span>
                <input
                  id="knotInput"
                  type="text"
                  inputmode="text"
                  autocomplete="off"
                  placeholder="Una decisione, una paura…"
                />
              </label>

              <div class="settings-row">
                <label>
                  <input id="fullRosaryToggle" type="checkbox" />
                  Rosario completo
                </label>
                <label>
                  Voce
                  <select id="voiceSelect" aria-label="Seleziona voce"></select>
                </label>
              </div>
            </div>
          </details>
        </article>

        <aside class="rosary-stage rosary-stage-dedicated" aria-label="Grani del Rosario">
          <div class="strand-topline">
            <span>Grani</span>
            <strong id="currentStepCount">0 / 0</strong>
          </div>
          <div
            class="rosary-ring rosary-strand"
            id="rosaryRing"
            role="list"
            tabindex="0"
            aria-label="Scorri i grani del Rosario"
          ></div>
          <div class="strand-caption" aria-live="polite">
            <span>Passaggio</span>
            <strong id="currentStepTitle">Maria che scioglie i nodi</strong>
          </div>
        </aside>
      </section>
    </main>

    <nav class="mobile-player" aria-label="Controlli Rosario">
      <button class="primary-button" id="playButton" type="button">Play</button>
      <button class="ghost-button" id="pauseButton" type="button">Pausa</button>
      <button class="ghost-button" id="nextButton" type="button">Avanti</button>
      <button class="ghost-button" id="resetButton" type="button">Reset</button>
    </nav>

    <script src="app.js" defer></script>
  </body>
</html>
